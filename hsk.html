<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSK Trainer">
<meta name="theme-color" content="#4a7fd4">
<title>HSK 2–3 Trainer</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#222;--mut:#777;--pri:#4a7fd4;--ok:#3fae6a;--warn:#f0913a;--bad:#e05252;--bd:#e8e4dc;--soft:#eee;--sel:#e9f0fb;--exb:#f6f4ef}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#22242a;--tx:#e8e8e8;--mut:#9a9a9a;--bd:#33363d;--soft:#33363d;--sel:#26344d;--exb:#2b2d33}}
:root[data-theme="dark"]{--bg:#17181b;--card:#22242a;--tx:#e8e8e8;--mut:#9a9a9a;--bd:#33363d;--soft:#33363d;--sel:#26344d;--exb:#2b2d33}
html{-webkit-text-size-adjust:100%}button,.opt,.chip{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai","Noto Sans SC",sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh}
nav{width:200px;background:var(--card);border-right:1px solid var(--bd);padding:16px 8px;position:sticky;top:0;height:100vh}
nav h1{font-size:18px;margin:4px 10px 16px;color:var(--pri)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:15px;cursor:pointer;color:var(--tx)}
nav button.on{background:var(--sel);color:var(--pri);font-weight:600}
main{flex:1;padding:24px;max-width:1000px;margin:auto;width:100%}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px #0000000d;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat b{display:block;font-size:28px;color:var(--pri)}.stat span{color:var(--mut);font-size:13px}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:15px;margin:4px 4px 4px 0}
.btn.g{background:var(--soft);color:var(--tx)}.btn.ok{background:var(--ok)}.btn.w{background:var(--warn)}.btn.r{background:var(--bad)}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
input,select,textarea{background:var(--card);color:var(--tx);padding:9px;border:1px solid var(--bd);border-radius:10px;font-size:15px;font-family:inherit}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.hz{font-size:22px;font-family:"Noto Sans SC",sans-serif}.py{color:var(--pri)}.th{color:var(--tx)}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:9px;background:var(--sel);margin:2px}
.fc{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;transition:transform .2s}
.fc .big{font-size:72px}
.ex{background:var(--exb);border-radius:10px;padding:10px;margin:8px 0;text-align:left}.ex mark{background:#ffe08a;color:#222}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;cursor:pointer;font-size:16px}
.opt.c{background:#3fae6a33;border-color:var(--ok)}.opt.x{background:#e0525233;border-color:var(--bad)}
.chip{display:inline-block;padding:8px 12px;margin:4px;border-radius:10px;background:var(--sel);cursor:pointer;font-size:20px}
.spk{border:0;background:none;cursor:pointer;font-size:18px}
@media(max-width:700px){#app{flex-direction:column}nav{position:fixed;bottom:0;top:auto;height:auto;width:100%;display:flex;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--bd);z-index:9}nav h1{display:none}nav button{font-size:12px;padding:8px;text-align:center;white-space:nowrap}main{padding:calc(14px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}input,select,textarea{font-size:16px}#q{width:100%!important}table td,table th{padding:6px 4px}.fc .big{font-size:56px}}
</style>
</head>

<nav id="nav"><h1>🀄 HSK Trainer</h1></nav>

const CONF=[{w:["觉得","认为"],note:"觉得 = ความรู้สึกส่วนตัว ภาษาพูด; 认为 = ความเห็นที่มีเหตุผล ทางการกว่า",err:"❌ 我认为很冷 → ✅ 我觉得很冷 (ความรู้สึกทางกาย)"},{w:["知道","认识"],note:"知道 = รู้ข้อมูล/ข้อเท็จจริง; 认识 = รู้จักคน สถานที่ ตัวอักษร",err:"❌ 我知道他 (ถ้าหมายถึงเคยพบ) → ✅ 我认识他"},{w:["可以","能","会"],note:"会 = ทักษะที่เรียนมา; 能 = มีความสามารถ/เงื่อนไขเอื้อ; 可以 = ได้รับอนุญาต",err:"❌ 我可以说汉语 (ทักษะ) → ✅ 我会说汉语"},{w:["二","两"],note:"二 ใช้นับเลข ลำดับ เบอร์; 两 ใช้หน้าลักษณนาม",err:"❌ 二个人 → ✅ 两个人"}];

// ===== State (localStorage)
const KEY="hskTrainer";
let S;try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}S=S||{p:{},memo:{},bm:{},log:{},exam:[],set:{daily:10,lv:"all"}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const P=id=>S.p[id]||(S.p[id]={n:0,ef:2.5,iv:0,due:null,ok:0,bad:0,last:null});
const pool=()=>V.filter(w=>S.set.lv==="all"||(S.set.lv==="2"?w.lv<=2:w.lv===3));
const learned=w=>!!(S.p[w.id]&&S.p[w.id].seen);
const isDue=w=>learned(w)&&S.p[w.id].due<=today();
const acc=w=>{const p=S.p[w.id];return p&&p.ok+p.bad?p.ok/(p.ok+p.bad):1};
function logDay(k){const d=today();S.log[d]=S.log[d]||{rev:0,ok:0,bad:0};S.log[d][k]++;}
// SM-2: q = 0 Again, 3 Hard, 4 Good, 5 Easy
function grade(w,q){const p=P(w.id);p.seen=1;p.last=today();
 if(q<3){p.n=0;p.iv=0;p.bad++}else{p.ok++;p.n++;p.iv=p.n===1?1:p.n===2?6:Math.round(p.iv*p.ef);if(q===5)p.iv=Math.round(p.iv*1.3)}
 p.ef=Math.max(1.3,p.ef+0.1-(5-q)*(0.08+(5-q)*0.02));
 const d=new Date();d.setDate(d.getDate()+p.iv);p.due=d.toISOString().slice(0,10);
 logDay("rev");logDay(q<3?"bad":"ok");save();}
const status=w=>{const p=S.p[w.id];if(!p||!p.seen)return["ใหม่","#999"];if(acc(w)<.6)return["ยาก","var(--bad)"];if(p.iv>=21)return["จำได้แล้ว","var(--ok)"];return["กำลังเรียน","var(--warn)"]};
function streak(){let s=0,d=new Date();while(S.log[d.toISOString().slice(0,10)]){s++;d.setDate(d.getDate()-1)}return s}

// ===== Helpers
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function say(t,rate){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=rate||S.set.rate||0.9;speechSynthesis.speak(u)}
const spk=(t)=>`<button class="spk" onclick="event.stopPropagation();say('${t}')">🔊</button><button class="spk" title="ช้า" onclick="event.stopPropagation();say('${t}',.5)">🐢</button>`;
const hl=(s,w)=>esc(s).split(w).join(`<mark>${w}</mark>`);
const exBox=w=>`<div class="ex"><div class="hz" style="font-size:18px">${hl(w.ex.cn,w.hz)} ${spk(w.ex.cn)}</div><div class="py">${w.ex.py}</div><div class="th">${w.ex.th}</div></div>`;
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const related=w=>V.filter(x=>x!==w&&([...w.hz].some(c=>x.hz.includes(c))||x.grp===w.grp)).slice(0,6);

const PAGES={dash:"📊 แดชบอร์ด",vocab:"📚 คำศัพท์",fc:"🃏 แฟลชการ์ด",grp:"🧩 กลุ่มคำ",memo:"📝 บันทึก",exam:"✍️ ฝึกสอบ",set:"⚙️ ตั้งค่า"};

$("#nav").innerHTML+=Object.entries(PAGES).map(([k,v])=>`<button data-p="${k}" onclick="go('${k}')">${v}</button>`).join("");
const R={};

R.dash=()=>{const pl=pool(),L=pl.filter(learned).length,due=pl.filter(isDue).length;
 const tot=Object.values(S.log).reduce((a,d)=>[a[0]+d.ok,a[1]+d.bad],[0,0]),ac=tot[0]+tot[1]?Math.round(tot[0]/(tot[0]+tot[1])*100):0;
 const lvP=l=>{const a=V.filter(w=>l===2?w.lv<=2:w.lv===3);return Math.round(a.filter(learned).length/a.length*100)};
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=d.toISOString().slice(0,10);return[k.slice(5),(S.log[k]||{}).rev||0]});
 const mx=Math.max(1,...days.map(d=>d[1]));
 const weak=V.filter(w=>S.p[w.id]&&S.p[w.id].bad>0).sort((a,b)=>acc(a)-acc(b)).slice(0,6);

 $("#main").innerHTML=`<h2>สวัสดี! 你好 👋</h2>

 <button class="btn" onclick="go('fc')">▶ เริ่มเรียน</button><button class="btn g" onclick="go('exam')">ทำข้อสอบ</button><button class="btn g" onclick="go('memo')">บันทึกของฉัน</button><button class="btn g" onclick="go('grp')">กลุ่มคำ</button></div>
 <div class="card"><h3>📈 ความคืบหน้า</h3>
 <p>HSK 1–2: ${lvP(2)}%</p><div class="bar"><i style="width:${lvP(2)}%"></i></div>
 <p>HSK 3: ${lvP(3)}%</p><div class="bar"><i style="width:${lvP(3)}%;background:var(--pri)"></i></div>

 <h4>กิจกรรม 7 วัน</h4><div style="display:flex;align-items:flex-end;gap:8px;height:120px">${days.map(d=>`<div style="flex:1;text-align:center"><div style="background:var(--pri);border-radius:6px 6px 0 0;height:${d[1]/mx*90}px" title="${d[1]}"></div><div class="mut">${d[0]}</div></div>`).join("")}</div></div>
 <div class="card"><h3>⚠️ คำที่ยัง ไม่แม่น</h3>${weak.length?weak.map(w=>`<span class="tag" style="font-size:16px">${w.hz} ${w.th} (${Math.round(acc(w)*100)}%)</span>`).join(""):'<p class="mut">ยังไม่มี — เยี่ยมมาก!</p>'}</div>`};

R.vocab=(q="",f="all")=>{const L=pool().filter(w=>{const s=q.toLowerCase();
 if(s&&![w.hz,w.py,w.th,w.en,w.py.normalize("NFD").replace(/[̀-ͯ]/g,"")].some(x=>x.toLowerCase().includes(s)))return false;
 return f==="all"||(f==="l"&&learned(w))||(f==="n"&&!learned(w))||(f==="d"&&isDue(w))||(f==="b"&&S.bm[w.id])||(f==="h"&&learned(w)&&acc(w)<.6)||f===w.pos||f===w.grp});
 const grps=[...new Set(V.map(w=>w.grp))];
 $("#main").innerHTML=`<h2>📚 คำศัพท์</h2><div class="card"><input id="q" placeholder="ค้นหา: 汉字 / pinyin / ไทย / English" value="${esc(q)}" style="width:60%">
 <select id="f"><option value="all">ทั้งหมด</option><option value="l">เรียนแล้ว</option><option value="n">ยังไม่เรียน</option><option value="d">ถึงเวลาทบทวน</option><option value="h">คำยาก</option><option value="b">บุ๊กมาร์ก</option>${Object.entries(POS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}${grps.map(g=>`<option>${g}</option>`).join("")}</select>
 <span class="mut">${L.length} คำ</span></div>
 <div class="card"><table><tr><th>汉字</th><th>Pinyin</th><th>ไทย / English</th><th>HSK</th><th>สถานะ</th></tr>${L.map(w=>{const s=status(w);return`<tr onclick="detail(${w.id})" style="cursor:pointer"><td class="hz">${w.hz}</td><td class="py">${w.py}</td><td>${w.th}<div class="mut">${w.en} · ${POS[w.pos]}</div></td><td>${w.lv}</td><td style="color:${s[1]}">${s[0]}${S.bm[w.id]?" ⭐":""}</td></tr>`}).join("")}</table></div>`;
 $("#f").value=f;const upd=()=>{const p=$("#q").selectionStart;R.vocab($("#q").value,$("#f").value);$("#q").focus();$("#q").setSelectionRange(p,p)};$("#q").oninput=upd;$("#f").onchange=upd};

function detail(id){const w=V[id];
 $("#main").innerHTML=`<button class="btn g" onclick="go('vocab')">← กลับ</button><div class="card" style="text-align:center"><div class="hz" style="font-size:80px">${w.hz}</div><div class="py" style="font-size:22px">${w.py} ${spk(w.hz)}</div><h3>${w.th}</h3><div class="mut">${w.en} · ${POS[w.pos]} · HSK ${w.lv} · ${w.grp}</div></div>
 ${wordInfo(w)}`}
function wordInfo(w){const rel=related(w);
 return`<div class="card"><h4>📖 ประโยคตัวอย่าง</h4>${exBox(w)}
 ${w.tip?`<h4>💡 จำง่าย ๆ (Remember This)</h4><p>${w.tip}</p>`:""}
 ${[...w.hz].length>1?`<p class="mut">แยกตัวอักษร: ${[...w.hz].map(c=>byHz[c]?`${c}=${byHz[c].th}`:c).join(" · ")}</p>`:""}
 <h4>🔗 คำที่เกี่ยวข้อง</h4>${rel.map(r=>`<span class="tag" style="font-size:15px;cursor:pointer" onclick="detail(${r.id})">${r.hz} ${r.py} – ${r.th}</span>`).join("")||"-"}
 <h4>📝 บันทึกของฉัน</h4><textarea id="mm" rows="3" style="width:100%" placeholder="เทคนิคจำ, ไวยากรณ์, ประโยคของฉัน...">${esc(S.memo[w.id]||"")}</textarea>
 <button class="btn" onclick="S.memo[${w.id}]=$('#mm').value;save();this.textContent='บันทึกแล้ว ✓'">บันทึก</button>
 <button class="btn ${S.bm[w.id]?"w":"g"}" onclick="S.bm[${w.id}]=!S.bm[${w.id}];save();this.textContent=S.bm[${w.id}]?'⭐ บุ๊กมาร์กแล้ว':'☆ บุ๊กมาร์ก'">${S.bm[w.id]?"⭐ บุ๊กมาร์กแล้ว":"☆ บุ๊กมาร์ก"}</button></div>`}

let Q=[],qi=0,flip=false;
R.fc=()=>{const pl=pool(),due=pl.filter(isDue).sort((a,b)=>acc(a)-acc(b)),nw=pl.filter(w=>!learned(w)).slice(0,S.set.daily);
 Q=shuffle([...due,...nw]);qi=0;
 if(!Q.length){$("#main").innerHTML=`<div class="card"><h2>🎉 วันนี้ครบแล้ว!</h2><p>ไม่มีคำที่ต้องทบทวน</p><button class="btn" onclick="Q=shuffle(pool());qi=0;card()">ฝึกทั้งหมดอีกรอบ</button></div>`;return}card()};
function card(){flip=false;if(qi>=Q.length){$("#main").innerHTML=`<div class="card"><h2>✅ จบเซสชัน!</h2><p>ทบทวนไป ${Q.length} คำ</p><button class="btn" onclick="go('dash')">กลับแดชบอร์ด</button><button class="btn g" onclick="go('exam')">ทำแบบทดสอบสั้น</button></div>`;return}
 const w=Q[qi];$("#main").innerHTML=`<p class="mut">${qi+1}/${Q.length} · Space=พลิก · 1–4=ให้คะแนน · ปัดซ้าย=ยาก ขวา=ง่าย ขึ้น=จำได้</p><div class="bar"><i style="width:${qi/Q.length*100}%"></i></div><br>
 <div class="card fc" id="fc" onclick="doFlip()"><div class="big hz">${w.hz}</div><div>${spk(w.hz)}</div><button class="btn g" onclick="event.stopPropagation();this.textContent='${w.py[0]}… · ${w.en}'">💡 คำใบ้</button><p class="mut">แตะเพื่อพลิก</p></div><div id="back"></div>`;
 say(w.hz);swipe($("#fc"))}
function doFlip(){if(flip)return;flip=true;const w=Q[qi];
 $("#fc").innerHTML=`<div class="big hz">${w.hz}</div><div class="py" style="font-size:24px">${w.py} ${spk(w.hz)}</div><h2>${w.th}</h2><div class="mut">${w.en} · ${POS[w.pos]}</div>`;
 $("#back").innerHTML=`<div class="card" style="text-align:center"><button class="btn r" onclick="rate(0)">1 ลืม</button><button class="btn w" onclick="rate(3)">2 ยาก</button><button class="btn" onclick="rate(4)">3 จำได้</button><button class="btn ok" onclick="rate(5)">4 ง่าย</button></div>${wordInfo(w)}`}
function rate(q){const w=Q[qi];grade(w,q);if(q<3)Q.push(w);qi++;card()}
function swipe(el){let x0,y0;el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 el.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
 if(Math.max(Math.abs(dx),Math.abs(dy))<60)return;if(Math.abs(dy)>Math.abs(dx)){if(dy<0)rate(5)}else rate(dx>0?4:3)})}
document.addEventListener("keydown",e=>{if(cur!=="fc"||/INPUT|TEXTAREA/.test(e.target.tagName)||!Q[qi])return;
 if(e.code==="Space"){e.preventDefault();doFlip()}else if(flip&&"1234".includes(e.key))rate([0,3,4,5]["1234".indexOf(e.key)])});

 const cg=Object.entries(chars).filter(e=>e[1].length>=3);
 const row=w=>`<div onclick="detail(${w.id})" style="cursor:pointer;padding:4px 0"><span class="hz">${w.hz}</span> <span class="py">${w.py}</span> – ${w.th} ${spk(w.hz)}</div>`;

 <h3>D. คำตรงข้าม</h3><div class="card">${OPP.map(([a,b])=>`<div style="font-size:20px;padding:4px"><span class="hz">${a}</span> ${byHz[a].th} ↔ <span class="hz">${b}</span> ${byHz[b].th}</div>`).join("")}</div>
 <h3>E. คำที่มักสับสน</h3>${CONF.map(s=>`<div class="card"><h4>${s.w.join(" vs ")}</h4>${s.w.map(h=>row(byHz[h])+exBox(byHz[h])).join("")}<p>📌 ${s.note}</p><p style="color:var(--bad)">${s.err}</p></div>`).join("")}`};

let E=[],ei=0,score=0,wrong=[];
const TYPES={mean:"เลือกความหมายที่ถูกต้อง",py:"เลือกพินอินที่ถูกต้อง",word:"เลือกคำศัพท์จีนที่ถูกต้อง",fill:"เติมคำในช่องว่าง",listen:"ฟังแล้วเลือกความหมาย",order:"เรียงคำให้เป็นประโยค"};
R.exam=()=>{const h=(E.length?`<p class="mut">ผลล่าสุด: ${S.exam.slice(-3).map(x=>x.d+" "+x.s+"%").join(" · ")}</p>`:"");
 $("#main").innerHTML=`<h2>✍️ ฝึกสอบ HSK</h2><div class="card"><h3>สอบจำลอง</h3><button class="btn" onclick="startExam('2')">HSK 2 (15 ข้อ)</button><button class="btn" onclick="startExam('3')">HSK 3 (15 ข้อ)</button><button class="btn" onclick="startExam('all')">ผสม 2–3 (20 ข้อ)</button></div>
 <div class="card"><h3>ฝึกเฉพาะประเภท</h3>${Object.entries(TYPES).map(([k,v])=>`<button class="btn g" onclick="startExam('all','${k}')">${v}</button>`).join("")}</div>
 <div class="card"><h3>ประวัติ</h3>${S.exam.slice(-8).reverse().map(x=>`<div>${x.d} · ${x.n} · <b>${x.s}%</b></div>`).join("")||'<p class="mut">ยังไม่มี</p>'}</div>`};
function startExam(lv,type){const src=V.filter(w=>lv==="all"||(lv==="2"?w.lv<=2:w.lv===3)),n=type?10:lv==="all"?20:15;
 E=shuffle(src).slice(0,n).map(w=>mkQ(w,type||shuffle(Object.keys(TYPES))[0],src));ei=0;score=0;wrong=[];E.name=type?TYPES[type]:"Mock HSK "+(lv==="all"?"2–3":lv);showQ()}
function mkQ(w,t,src){const others=shuffle(src.filter(x=>x!==w)).slice(0,3),opts=shuffle([w,...others]);
 if(t==="order"){const parts=w.ex.cn.replace(/[。？！，]/g,"").match(new RegExp(`${w.hz}|.{1,2}`,"g"));return{t,w,parts}}
 return{t,w,opts}}
function showQ(){if(ei>=E.length)return result();const q=E[ei],w=q.w;let body="";
 const o=(f)=>q.opts.map((x,i)=>`<button class="opt" onclick="ans(this,${x===w})">${f(x)}</button>`).join("");
 if(q.t==="mean")body=`<div class="hz" style="font-size:56px">${w.hz}</div>${o(x=>x.th+" ("+x.en+")")}`;
 if(q.t==="py")body=`<div class="hz" style="font-size:56px">${w.hz}</div>${o(x=>x.py)}`;
 if(q.t==="word")body=`<h2>${w.th}</h2>${o(x=>`<span class="hz">${x.hz}</span>`)}`;
 if(q.t==="fill")body=`<div class="hz" style="font-size:26px">${esc(w.ex.cn).split(w.hz).join("＿＿")}</div><div class="mut">${w.ex.th}</div>${o(x=>`<span class="hz">${x.hz}</span> <span class="mut">${x.py}</span>`)}`;
 if(q.t==="listen"){body=`<button class="btn" onclick="say('${w.hz}')">🔊 ฟังอีกครั้ง</button>${o(x=>x.th)}`;setTimeout(()=>say(w.hz),300)}
 if(q.t==="order"){q.pick=[];body=`<div class="mut">${w.ex.th}</div><div id="ans" class="card" style="min-height:60px"></div><div id="pool">${shuffle(q.parts.map((p,i)=>[p,i])).map(([p,i])=>`<span class="chip" onclick="pick(this,'${p}')">${p}</span>`).join("")}</div><button class="btn" onclick="chkOrder()">ตรวจ</button><button class="btn g" onclick="showQ()">ล้าง</button>`}
 $("#main").innerHTML=`<p class="mut">${E.name} · ข้อ ${ei+1}/${E.length} · คะแนน ${score}</p><div class="bar"><i style="width:${ei/E.length*100}%"></i></div><div class="card"><h3>${TYPES[q.t]}</h3>${body}<div id="fb"></div></div>`}
function pick(el,p){E[ei].pick.push(p);el.remove();$("#ans").innerHTML+=`<span class="chip">${p}</span>`}
function chkOrder(){const q=E[ei];ans(null,q.pick.join("")===q.parts.join(""))}
function ans(el,ok){const q=E[ei],w=q.w;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
 if(el)el.classList.add(ok?"c":"x");if(ok)score++;else wrong.push(w);
 const p=P(w.id);ok?p.ok++:p.bad++;logDay(ok?"ok":"bad");save();
 $("#fb").innerHTML=`<p style="color:${ok?"var(--ok)":"var(--bad)"}"><b>${ok?"✓ ถูกต้อง":"✗ ผิด"}</b> — ${w.hz} (${w.py}) = ${w.th}</p>${exBox(w)}<button class="btn" onclick="ei++;showQ()">ถัดไป →</button>`;
 if(q.t==="order")$("#pool").innerHTML=""}
function result(){const pc=Math.round(score/E.length*100);S.exam.push({d:today(),n:E.name,s:pc});save();
 $("#main").innerHTML=`<div class="card"><h2>ผลสอบ: ${pc}%</h2><p>ถูก ${score} · ผิด ${E.length-score} · ทั้งหมด ${E.length}</p><div class="bar"><i style="width:${pc}%"></i></div></div>
 <div class="card"><h3>📌 คำที่ควรทบทวน</h3>${wrong.map(w=>`<div onclick="detail(${w.id})" style="cursor:pointer;padding:6px 0"><span class="hz">${w.hz}</span> <span class="py">${w.py}</span> – ${w.th}<div class="mut">${w.tip||w.ex.cn+" / "+w.ex.th}</div></div>`).join("")||"ไม่มี เยี่ยมมาก! 🎉"}
 ${wrong.length?`<button class="btn w" onclick="Q=[...wrong];qi=0;cur='fc';card()">ทบทวนคำที่ผิดด้วยแฟลชการ์ด</button>`:""}<button class="btn g" onclick="go('exam')">กลับ</button></div>`}

// Settings
R.set=()=>{$("#main").innerHTML=`<h2>⚙️ ตั้งค่า</h2><div class="card">
 <p>คำใหม่ต่อวัน: <input id="dly" type="number" min="1" max="50" value="${S.set.daily}" style="width:80px"></p>
 <p>ระดับ HSK: <select id="lv"><option value="all">HSK 2–3 ทั้งหมด</option><option value="2">HSK 1–2</option><option value="3">HSK 3</option></select></p>
 <p>ความเร็วเสียง: <input id="rt" type="range" min="0.4" max="1.2" step="0.1" value="${S.set.rate||0.9}"> <button class="btn g" onclick="say('你好，欢迎学习汉语')">ทดสอบเสียง</button></p>
 <button class="btn" onclick="S.set.daily=+$('#dly').value;S.set.lv=$('#lv').value;S.set.rate=+$('#rt').value;save();this.textContent='บันทึกแล้ว ✓'">บันทึก</button></div>
 <div class="card"><h3>สำรองข้อมูล</h3><button class="btn g" onclick="dl('hsk-progress.json',JSON.stringify(S))">⬇ Export JSON</button><button class="btn g" onclick="dl('hsk-vocab.csv','hanzi,pinyin,thai,english,hsk\\n'+V.map(w=>[w.hz,w.py,w.th,w.en,w.lv].join(',')).join('\\n'))">⬇ Export คำศัพท์ CSV</button>
 <label class="btn g">⬆ Import JSON<input type="file" accept=".json" hidden onchange="imp(this)"></label>
 <button class="btn r" onclick="if(confirm('ลบความคืบหน้าทั้งหมด?')){localStorage.removeItem(KEY);location.reload()}">รีเซ็ต</button>
 <p class="mut">ข้อมูลเก็บในเบราว์เซอร์ (localStorage) · รายการคำศัพท์เป็นตัวอย่างสำหรับฝึก ควรตรวจสอบกับรายการ HSK ทางการ</p></div>`;$("#lv").value=S.set.lv};
function dl(n,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();alert("นำเข้าสำเร็จ");go("dash")}catch{alert("ไฟล์ไม่ถูกต้อง")}};r.readAsText(i.files[0])}

go("dash");
